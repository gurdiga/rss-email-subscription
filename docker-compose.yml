# Memento: docker-compose.override.yml, git-ignored, may be silently merged in.

x-logging: &logging
  logging:
    driver: syslog
    options:
      syslog-address: tcp://10.5.5.1:514
      syslog-format: rfc3164
      tag: '{{.Name}}'

# Split by who reads what, so each container gets only the secrets it uses: delmon
# just the data dir; app (cron) also mail and subscription cancellation; api the rest.
x-base-env: &base-env
  TZ: UTC
  DATA_DIR_ROOT: /data
  NODE_ENV: ${NODE_ENV?} #See https://github.com/nodejs/docker-node/blob/main/docs/BestPractices.md

x-cron-env: &cron-env
  DOMAIN_NAME: ${DOMAIN_NAME?}
  SMTP_CONNECTION_STRING: ${SMTP_CONNECTION_STRING?}
  PADDLE_ENVIRONMENT: ${PADDLE_ENVIRONMENT?}
  PADDLE_API_KEY: ${PADDLE_API_KEY?}

x-api-env: &api-env
  # Unset means rate limiting is ON. Set by `make start-api` (and `start-website`,
  # which depends on it) for api-test. The api logs which state it started in.
  RATE_LIMITING_DISABLED: ${RATE_LIMITING_DISABLED:-}
  # DEBUG: '*' # Useful for debuggind Express.js routing
  PADDLE_CLIENT_TOKEN: ${PADDLE_CLIENT_TOKEN?}
  PADDLE_WEBHOOK_SECRET: ${PADDLE_WEBHOOK_SECRET?}
  # nginx's own static address on this file's network (the website service,
  # below) — api needs it for Express's trust-proxy setting (see server.ts).
  # Sourced from the same variable as that service's ipv4_address so the two
  # can't drift apart silently.
  NGINX_IP_ADDRESS: ${NGINX_IP_ADDRESS?}

x-disable-ipv6: &x-disable-ipv6
  sysctls:
    net.ipv6.conf.all.disable_ipv6: 1
    net.ipv6.conf.default.disable_ipv6: 1
    net.ipv6.conf.lo.disable_ipv6: 1

x-dns: &x-dns
  dns: 10.5.5.2

services:
  smtp-out:
    depends_on:
      logger:
        condition: service_healthy
      resolver:
        condition: service_healthy
    container_name: smtp-out
    hostname: smtp-out
    image: smtp-out
    restart: always
    ports: ['127.0.0.1:1587:587']
    volumes:
      - ./.tmp/opendkim-keys:/mnt/opendkim-keys:ro
      - ./.tmp/postfix-queue:/var/spool/postfix
    environment:
      TZ: UTC
    <<: [*logging, *x-disable-ipv6, *x-dns]
    healthcheck:
      disable: true
    networks:
      net:
        ipv4_address: 10.5.5.9

  smtp-in:
    depends_on:
      logger:
        condition: service_healthy
      resolver:
        condition: service_healthy
    container_name: smtp-in
    hostname: smtp-in
    image: smtp-in
    ports: ['25:25']
    restart: always
    # Time for the entrypoint to drain the queue on stop, see run_postfix.
    stop_grace_period: 90s
    volumes:
      - ./.tmp/certbot/conf/live/feedsubscription.com/fullchain.pem:/etc/postfix/cert/smtp.cert:ro
      - ./.tmp/certbot/conf/live/feedsubscription.com/privkey.pem:/etc/postfix/cert/smtp.key:ro
    environment:
      SMTP_IN_SASL_PASSWORD: ${SMTP_IN_SASL_PASSWORD?}
    <<: [*logging, *x-disable-ipv6, *x-dns]
    # net-tools has netstat but no nc, and there's no wget/curl here either
    # — postfix's own status check needs neither.
    healthcheck:
      test: ['CMD-SHELL', 'postfix status']
      interval: 30s
      timeout: 3s
      retries: 2
      start_period: 30s
      start_interval: 2s
    networks:
      net:
        ipv4_address: 10.5.5.8

  postilion:
    depends_on:
      logger:
        condition: service_healthy
      resolver:
        condition: service_healthy
    container_name: postilion
    hostname: postilion
    image: postilion
    restart: always
    ports: ['587:587']
    volumes:
      - ./.tmp/opendkim-keys:/mnt/opendkim-keys:ro
      - ./.tmp/postilion-queue:/var/spool/postfix
      - ./.tmp/certbot/conf/live/feedsubscription.com/fullchain.pem:/etc/postfix/cert/smtp.cert:ro
      - ./.tmp/certbot/conf/live/feedsubscription.com/privkey.pem:/etc/postfix/cert/smtp.key:ro
    environment:
      TZ: UTC
      POSTILION_SASL_PASSWORD_GURDIGA_COM: ${POSTILION_SASL_PASSWORD_GURDIGA_COM?}
      POSTILION_SASL_PASSWORD_SANDRADODD_COM: ${POSTILION_SASL_PASSWORD_SANDRADODD_COM?}
    <<: [*logging, *x-disable-ipv6, *x-dns]
    healthcheck:
      test: ['CMD-SHELL', 'postfix status']
      interval: 30s
      timeout: 3s
      retries: 2
      start_period: 30s
      start_interval: 2s
    networks:
      net:
        ipv4_address: 10.5.5.10

  app:
    depends_on:
      logger:
        condition: service_healthy
      resolver:
        condition: service_healthy
    container_name: app
    hostname: app
    image: app
    init: true # This is to tell Node process to stop when the container is asked to stop.
    restart: always
    volumes:
      - ${DATA_DIR_ROOT?}:/data
    # NOTE: This doesn’t work, and I’m not fixing it now because I don’t
    # know how, and it’s not worth the effort of further investigation.
    # extra_hosts:
    #   - 'feedsubscription.com:207.154.253.211'
    environment:
      <<: [*base-env, *cron-env]
    command: node dist/app/cron.js
    # A day of 5-minute samples peaked at 79 MiB. Items are parsed in
    # a worker capped at 192 MiB of heap (item-content-worker.ts), one
    # at a time, so 384m leaves room.
    mem_limit: 384m
    <<: [*logging, *x-disable-ipv6, *x-dns]
    networks:
      net:
        ipv4_address: 10.5.5.7

  delmon:
    depends_on:
      logger:
        condition: service_healthy
      resolver:
        condition: service_healthy
    container_name: delmon
    hostname: delmon
    image: app
    init: true # This is to tell Node process to stop when the container is asked to stop.
    restart: always
    # Doubled $$ so Compose passes the guard into the container instead of
    # resolving it against the host environment at parse time.
    #
    # exec with tail in a process substitution, not `tail | node`: in a
    # pipeline sh stays the child of docker-init and takes the signals, so
    # `docker kill -s HUP delmon` kills the container instead of reaching
    # node's heartbeat handler. <(…) is not POSIX; busybox ash has it.
    #
    # The guard runs on its own first because inside <(…) it would only
    # fail the subshell, and node would start anyway with nothing to read.
    command: >-
      sh -c ': "$${SMTP_OUT_LOG:?SMTP_OUT_LOG is not set}";
      exec node dist/app/delivery-monitoring < <(tail -n 0 -F "$$SMTP_OUT_LOG")'
    # It parses log lines only. A day of 5-minute samples peaked at
    # 44 MiB, on startup.
    mem_limit: 128m
    volumes:
      - .tmp/logs/feedsubscription:/logs:ro
      - ${DATA_DIR_ROOT?}:/data
    environment:
      <<: *base-env
      SMTP_OUT_LOG: /logs/smtp-out.log
    <<: [*logging, *x-disable-ipv6, *x-dns]
    networks:
      net:
        ipv4_address: 10.5.5.6

  api:
    depends_on:
      logger:
        condition: service_healthy
      resolver:
        condition: service_healthy
    container_name: api
    hostname: api
    image: app
    init: true # This is to tell Node process to stop when the container is asked to stop.
    restart: always
    command: node dist/api/server.js
    # As for app: a day's peak of 67 MiB, plus the parsing worker for
    # sample emails.
    mem_limit: 384m
    volumes:
      - ${DATA_DIR_ROOT?}:/data
    environment:
      # DEBUG: 'express:*'
      # TS_NODE_DEBUG: 'true'
      <<: [*base-env, *cron-env, *api-env]
    <<: [*logging, *x-disable-ipv6, *x-dns]
    # /cors-test is the cheapest unauthenticated route the router has.
    healthcheck:
      test: ['CMD-SHELL', 'wget -q -O /dev/null http://localhost:3000/cors-test']
      interval: 30s
      timeout: 3s
      retries: 2
      start_period: 30s
      start_interval: 2s
    networks:
      net:
        ipv4_address: 10.5.5.5

  # Thanks to https://github.com/wmnnd/nginx-certbot
  website:
    depends_on: [api]
    container_name: website
    hostname: website
    image: website
    restart: always
    ports: ['80:80', '443:443']
    volumes:
      - ./website/html:/usr/share/nginx/html:ro
      - ./website/nginx/conf.d:/etc/nginx/conf.d:ro
      - ./.tmp/nginx-blocklists:/etc/nginx/blocklists:ro
      - ./.tmp/certbot/conf:/etc/letsencrypt
      - ./.tmp/certbot/www:/var/www/certbot
    environment:
      NGINX_HOST: feedsubscription.com
    <<: [*logging, *x-disable-ipv6, *x-dns]
    # wget, not curl: the image deletes curl deliberately (see Dockerfile),
    # and /track is a fixed 200 with no upstream or redirect involved.
    healthcheck:
      test: ['CMD-SHELL', 'wget -q -O /dev/null --no-check-certificate https://localhost/track']
      interval: 30s
      timeout: 3s
      retries: 2
      start_period: 30s
      start_interval: 2s
    networks:
      net:
        ipv4_address: ${NGINX_IP_ADDRESS?}

  # Thanks to https://github.com/wmnnd/nginx-certbot
  certbot:
    depends_on:
      logger:
        condition: service_healthy
      resolver:
        condition: service_healthy
    container_name: certbot
    hostname: certbot
    image: certbot
    restart: always
    volumes:
      - ./.tmp/certbot/conf:/etc/letsencrypt
      - ./website/html:/var/www/certbot
    entrypoint: >-
      /bin/sh -c '
        certbot --version;
        exec crond -f -d 8;
      '
    <<: [*logging, *x-disable-ipv6, *x-dns]
    networks:
      net:
        ipv4_address: 10.5.5.3

  # logger and resolver gate every other service's start through
  # condition: service_healthy, and both are up within a second, so they
  # probe every 1s at start instead of waiting out a 30s interval each.
  # Nothing waits on the other healthchecks; those probe every 2s so a
  # boot on the 1-vCPU host doesn't spend CPU on forks.
  logger:
    container_name: logger
    hostname: logger
    image: logger
    restart: always
    volumes:
      - ./.tmp/logs:/var/log/syslog-ng
    <<: [*x-dns]
    healthcheck:
      test: ['CMD-SHELL', 'nc -z -w1 10.5.5.1 514']
      interval: 30s
      timeout: 3s
      retries: 2
      start_period: 10s
      start_interval: 1s
    networks:
      net:
        ipv4_address: 10.5.5.1

  resolver:
    depends_on:
      logger:
        condition: service_healthy
    hostname: resolver
    image: resolver
    container_name: resolver
    restart: always
    volumes:
      - ./.tmp/resolver/etc/hosts:/etc/hosts:ro
    networks:
      net:
        ipv4_address: 10.5.5.2
    <<: [*logging, *x-disable-ipv6]
    healthcheck:
      test: ['CMD-SHELL', 'pidof dnsmasq >/dev/null']
      interval: 30s
      timeout: 3s
      retries: 2
      start_period: 10s
      start_interval: 1s

networks:
  net:
    enable_ipv6: false # Trying to simplify the DNS issue context
    driver: bridge
    ipam:
      config:
        - subnet: 10.5.5.0/24
          gateway: 10.5.5.100
