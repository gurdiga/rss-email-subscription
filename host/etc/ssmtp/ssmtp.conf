#
# Config file for sSMTP sendmail
#
# Relays through smtp-out, on purpose: this is the channel independent
# of msmtp, used by watch-msmtp to report msmtp failures. Anything
# else that calls /usr/sbin/sendmail also lands here.
#
root=postmaster
mailhub=localhost:1587
hostname=feedsubscription.com

# Lets callers set their own From, e.g. "RES <system@feedsubscription.com>".
FromLineOverride=YES
